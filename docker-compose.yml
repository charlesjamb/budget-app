services:
  app:
    build: .
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/budget.db
    volumes:
      - db-data:/app/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt/live/your-domain.example/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - /etc/letsencrypt/live/your-domain.example/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  db-data:
